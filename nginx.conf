# Gateway / single public entrypoint for the prod-shaped Compose overlay (compose.gateway.yaml).
#
# One nginx serves the built Vite SPA AND reverse-proxies the backend prefixes, so there is no
# separate static-front container. This is the SOLE host-published port (:80); backend (:8080)
# and db (:5432) are internal-only in the overlay. The backend has no global /api prefix — it
# serves /api/*, /auth/*, and /ingest/* distinctly (see docs/api/route-inventory.md).
#
# Mounted read-only over the front runner image's baked /etc/nginx/conf.d/default.conf, so the
# SPA dist (already in the image) is served while routing lives in this root-level config.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SSE stream must be proxied directly to the backend and unbuffered, or it stalls the
  # realtime dashboard. Exact-match location so it takes precedence over the /api/ prefix.
  location = /api/sse {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Dashboard JSON API (and Swagger at /api/docs).
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Kakao OAuth login/callback/session (no /api prefix on the backend).
  location /auth/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Edge HMAC ingest, routed through the single host entrypoint.
  location /ingest/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA client-side routing fallback (served from the baked dist).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
