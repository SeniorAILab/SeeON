# macOS bind-mount watching is best-effort; native host development remains the daily default.
# Dev overlay for the host stack (db + backend + front). ML lives on the edge — see compose.edge.yaml.
services:
  backend:
    profiles: [full]
    build:
      target: dev
    environment:
      PORT: 8080
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
    command: ["pnpm", "--filter", "backend", "exec", "nest", "start", "--watch"]

  front:
    profiles: [full]
    build:
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/front/node_modules
    command: ["pnpm", "--filter", "front", "exec", "vite", "--host", "0.0.0.0", "--port", "3000"]
