# macOS bind-mount watching is best-effort; native host development remains the daily default.
services:
  backend:
    profiles: [full]
    build:
      target: dev
    environment:
      PORT: 8080
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
    command: ["pnpm", "--filter", "backend", "exec", "nest", "start", "--watch"]

  ml-serving:
    profiles: [full]
    build:
      target: dev
    volumes:
      - ./ml:/app/ml
      - /app/ml/.venv
    command: ["uv", "run", "--directory", "ml", "uvicorn", "serving.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]

  front:
    profiles: [full]
    build:
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/front/node_modules
      - /app/front/.next
    command: ["pnpm", "--filter", "front", "exec", "next", "dev", "-H", "0.0.0.0", "-p", "3000"]
