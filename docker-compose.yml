# PostgreSQL for dev/prod parity.
# Prisma's provider is locked to postgresql; dev and prod differ only by DATABASE_URL.
# Dev:  docker compose up -d db   (then backend reads .env.development)
#
# DB role separation (ADR-A / NR1):
#   fall     = superuser      → migrations, seed (DIRECT_URL)
#   fall_app = NOSUPERUSER NOBYPASSRLS → application runtime (DATABASE_URL)
#
# First-time setup requires a clean volume so initdb scripts run:
#   docker compose down -v && docker compose up -d db
services:
  db:
    image: postgres:17-alpine
    container_name: eldercare-fall-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fall}
      POSTGRES_DB: ${POSTGRES_DB:-fall_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run only on first DB initialization (clean volume required).
      - ./backend/prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fall} -d ${POSTGRES_DB:-fall_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
