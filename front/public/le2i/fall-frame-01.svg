<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="160" height="90" role="img" aria-label="ceiling camera view of a room">
  <defs>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1b2430"/>
      <stop offset="100%" stop-color="#080b10"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>
  <rect width="160" height="90" fill="url(#vig)"/>
  <!-- floor grid (top-down) -->
  <g stroke="#243140" stroke-width="0.4" opacity="0.55">
    <line x1="0" y1="22" x2="160" y2="22"/><line x1="0" y1="45" x2="160" y2="45"/>
    <line x1="0" y1="68" x2="160" y2="68"/>
    <line x1="40" y1="0" x2="40" y2="90"/><line x1="80" y1="0" x2="80" y2="90"/>
    <line x1="120" y1="0" x2="120" y2="90"/>
  </g>
  <!-- bed -->
  <g opacity="0.9">
    <rect x="14" y="14" width="40" height="62" rx="3" fill="#1f2b39" stroke="#33465b" stroke-width="0.6"/>
    <rect x="18" y="18" width="32" height="20" rx="2" fill="#26384a"/>
  </g>
  <!-- faint fallen-figure silhouette (deliberately low-detail; the crisp pose overlay carries the signal) -->
  <g filter="url(#soft)" opacity="0.5" fill="#3b4a5c">
    <ellipse cx="64" cy="63" rx="6" ry="6"/>
    <rect x="66" y="57" width="46" height="13" rx="6"/>
    <rect x="104" y="56" width="30" height="7" rx="3.5"/>
    <rect x="104" y="67" width="30" height="7" rx="3.5"/>
  </g>
  <!-- camera id + timestamp (operational realism) -->
  <text x="4" y="8" font-family="monospace" font-size="4.5" fill="#5b6b7d">CAM-03 · 305호</text>
  <text x="124" y="86" font-family="monospace" font-size="4.5" fill="#5b6b7d">02:14:07</text>
</svg>
