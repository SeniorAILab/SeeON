# Streamlit server config for the fall-detection demo (launched via `cd ml && streamlit run demo/app.py`).
[server]
# Default 200MB blocks longer clips; effectively unlimited for video uploads (#72).
maxUploadSize = 10240

[theme]
primaryColor = "#4A90E2"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F5"
textColor = "#333333"
font = "sans serif"
