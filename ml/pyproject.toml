[project]
name = "ml"
version = "0.1.0"
description = "Fall-detection ML: FastAPI api (online lifecycle) + worker (edge inference) + Streamlit demo. Training moved to eldercare-dataset-ops (ADR-0004)."
readme = "README.md"
requires-python = ">=3.11"

# Serving (online) dependencies — always-on path. Kept minimal for PoC.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pyyaml>=6",
]

# Lifecycle separation: demo/test/worker deps are isolated from the slim api path.
[dependency-groups]
demo = [
    "streamlit>=1.38",
    "ultralytics>=8.3",
]
test = [
    "pytest>=8.3",
    "httpx>=0.27",
]
worker = [
    "torch>=2.3",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "ultralytics>=8.3",
]

[tool.uv]
package = false
# The demo's temporal models load inference through worker.runners.sklearn_fall
# (InProcessFallClassifier); demo/worker tests fit synthetic sklearn artifacts
# directly. So a bare `uv run` must see demo+test+worker — no --group flags
# needed to run anything. The split itself stays: a slim api build can opt out
# via --no-default-groups.
default-groups = ["demo", "test", "worker"]
# Keep ultralytics from pulling the GUI OpenCV wheel alongside the repo-selected
# headless wheel; both distributions own cv2/ and corrupt clean uv installs.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".scratch"]

# Stability deny-list (docs/rules/code-stability.md, ADR):
#   B    bugbear — B904 raise-from, B006 mutable defaults
#   BLE  blind except Exception (boundary catches need `# noqa: BLE001` + reason)
#   S110/S112  try-except-pass / try-except-continue
#   TRY  tryceratops — TRY002 vanilla raise, TRY400 logging.exception in handlers
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "S110", "S112", "TRY"]
# TRY003 (no long messages outside exception class) is ignored deliberately:
# informative inline `raise ValueError(f"...")` messages ARE the explicit-refusal
# style this codebase wants; demanding a custom exception class per message
# discourages raising. All other TRY rules stay on.
ignore = ["TRY003"]

[tool.pytest.ini_options]
pythonpath = ["."]
