[project]
name = "ml"
version = "0.1.0"
description = "Fall-detection ML: training (batch lifecycle) + FastAPI serving (online lifecycle) + Streamlit demo."
readme = "README.md"
requires-python = ">=3.11"

# Serving (online) dependencies — always-on path. Kept minimal for PoC.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "numpy>=1.26",
]

# Lifecycle separation: training and demo deps are isolated from serving.
[dependency-groups]
demo = [
    "opencv-python-headless>=4.10",
    "streamlit>=1.38",
    "ultralytics>=8.3",
]
test = [
    "pytest>=8.3",
]
training = [
    "torch>=2.3",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "ultralytics>=8.3",             # extract_poses reuses demo.yolo_runtime -> ultralytics
    "opencv-python-headless>=4.10", # cv2.VideoCapture frame intake in extract_poses
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
