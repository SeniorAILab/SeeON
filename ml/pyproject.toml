[project]
name = "ml"
version = "0.1.0"
description = "Fall-detection ML: training (batch lifecycle) + FastAPI serving (online lifecycle) + Streamlit demo."
readme = "README.md"
requires-python = ">=3.11"

# Serving (online) dependencies — always-on path. Kept minimal for PoC.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "numpy>=1.26",
]

# Lifecycle separation: training and demo deps are isolated from serving.
[dependency-groups]
demo = [
    "streamlit>=1.38",
]
training = [
    # Deferred (PoC): ultralytics (YOLO11-pose), torch, albumentations,
    # experiment-tracking (mlflow/wandb). Add when training work starts.
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
