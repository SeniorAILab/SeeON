# Local prod-shaped topology overlay: single public gateway + internal backend/db (L1).
#
# Usage:
#   docker compose -f compose.yaml -f compose.gateway.yaml up -d --build --wait
#
# Shape this overlay produces (vs the base host stack):
#   - gateway: one nginx that serves the built SPA AND reverse-proxies the backend prefixes;
#     it is the ONLY host-published port (:80) — the single public entrypoint.
#   - backend (:8080) and db (:5432) lose their host port publications (internal-only) via
#     `ports: !reset []`, so they are reachable only inside the compose network.
#   - backend joins the stack without `--profile full` via `profiles: !reset []`.
#
# Base compose.yaml is NOT modified: plain `docker compose up` still brings up db only (daily
# dev = native hot reload), and the base `front` service stays gated behind the `full` profile.
#
# Preflight (validates the !reset merge): docker compose -f compose.yaml -f compose.gateway.yaml config
# Scope = L1 (structure-correct, NOT feature-working). Real login/data/SSE delivery, TLS, real
# secrets, edge/runbook URL updates, and CI/CD are out of scope (tracked as issues).
services:
  db:
    # Internal-only in this overlay. Base compose.yaml still publishes 5432 when used alone.
    ports: !reset []

  backend:
    # Join the overlay without `--profile full`, and drop the host port (internal-only).
    profiles: !reset []
    ports: !reset []
    environment:
      # Same-origin behind the gateway: the browser origin is the gateway, not :3000.
      FRONT_ORIGIN: http://localhost
    healthcheck:
      # node:24-alpine ships busybox wget; backend root GET / (getHello) is unguarded -> 200.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  gateway:
    # Reuse the front runner image (nginx + baked Vite dist), but mount the root nginx.conf so a
    # single nginx serves the SPA and reverse-proxies the backend. No front app-code change.
    build:
      context: .
      dockerfile: front/Dockerfile
      target: runner
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # The ONLY host-published port in this overlay.
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
