# Edge device stack — runs on the external edge node, NOT on the host stack.
# The edge performs ML inference locally and pushes signed events to the backend
# /ingest endpoint over the public network (ADR-029). Because the edge is on a
# separate host/network, it CANNOT reach the backend by Docker service name —
# ALERT_API_URL must be the backend's public ingest base URL.
#
# Usage (on the edge device):
#   docker compose -f compose.edge.yaml up -d --build
#
services:
  ml-api:
    build:
      context: .
      dockerfile: ml/Dockerfile.api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ML_SERVING_PORT:-8000}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ML_SERVING_HOST: 0.0.0.0
    volumes:
      - ${ML_MODELS_DIR:-./ml/models}:/app/models:ro
    command:
      - uvicorn
      - api.main:app
      - --host
      # Container-internal bind only; host publishing above is loopback-only.
      - ${ML_SERVING_HOST:-0.0.0.0}
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3

  ml-worker:
    build:
      context: .
      dockerfile: ml/Dockerfile.worker
    restart: unless-stopped
    environment:
      EDGE_CAMERA_CONFIG: /run/secrets/edge-cameras.json
    volumes:
      - ${ML_MODELS_DIR:-./ml/models}:/app/models:ro
    secrets:
      - source: edge-cameras
        target: edge-cameras.json
    command:
      - python
      - -m
      - worker.edge_worker
      - --config
      - /run/secrets/edge-cameras.json
      - --heartbeat-on-start

secrets:
  edge-cameras:
    file: ${EDGE_CAMERA_CONFIG:?edge requires a local camera config JSON}
