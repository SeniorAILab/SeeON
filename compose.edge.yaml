# Edge device stack — runs on the external edge node, NOT on the host stack.
# The edge performs ML inference locally. ml-worker relays alert/heartbeat facts
# to ml-api, and ml-api is the only process that signs and pushes backend
# /ingest requests over the public network (ADR-067/029). Because the edge is on
# a separate host/network, backend ingest URLs must use the backend public base URL.
#
# Usage (on the edge device):
#   docker compose -f compose.edge.yaml up -d --build
#
services:
  ml-api:
    build:
      context: .
      dockerfile: ml/Dockerfile.api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ML_SERVING_PORT:-8000}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ML_SERVING_HOST: 0.0.0.0
    volumes:
      - ${ML_MODELS_DIR:-./ml/models}:/app/models:ro
    command:
      - uvicorn
      - api.main:app
      - --host
      # Container-internal bind only; host publishing above is loopback-only.
      - ${ML_SERVING_HOST:-0.0.0.0}
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3

  ml-worker:
    build:
      context: .
      dockerfile: ml/Dockerfile.worker
    restart: unless-stopped
    environment:
      EDGE_CAMERA_CONFIG: /run/secrets/ml-worker.yaml
    volumes:
      - ${ML_MODELS_DIR:-./ml/models}:/app/models:ro
    secrets:
      - source: ml-worker-config
        target: ml-worker.yaml
    command:
      - python
      - -m
      - worker.edge_worker
      - --config
      - /run/secrets/ml-worker.yaml
      - --heartbeat-on-start

secrets:
  ml-worker-config:
    file: ${EDGE_CAMERA_CONFIG:?edge requires a local ml-worker YAML config}
