model = "gpt-5.5"
model_context_window = 400000
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"
[mcp_servers.notebooklm-mcp]
command = "notebooklm-mcp"

# Project conventions: follow ./AGENTS.md (single source of truth).

[hooks]
# pre_tool_use fires before each shell command tool execution.
#
# LIMITATION: Codex hooks are shell-scoped only — they intercept shell/exec tool calls
# but cannot see file-edit tool calls (write/patch operations).  File-edit protection
# on protected branches is covered by .githooks/pre-commit (set up via
# scripts/git-guard/setup-hooks.sh), which fires unconditionally at `git commit` time
# regardless of which agent authored the change.
#
# Both layers call the SAME scripts/git-guard/ scripts (single source of truth — D6).
# deny-assets.sh staged is chained after assert-not-main for early asset-upload guidance.
pre_tool_use = "sh \"$(git rev-parse --show-toplevel)/scripts/git-guard/assert-not-main.sh\" && sh \"$(git rev-parse --show-toplevel)/scripts/git-guard/deny-assets.sh\" staged"

# Managed by LazyCodex: multi_agent_v2 is re-disabled on every Codex session start
# because enabling it fails every turn with HTTP 400 (openai/codex#26753).
# Opt out: LAZYCODEX_CONFIG_MIGRATION_DISABLED=1 (or OMO_CODEX_CONFIG_MIGRATION_DISABLED=1).
[features.multi_agent_v2]
enabled = false
